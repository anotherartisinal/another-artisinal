<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Another Artisanal</title>
  <meta name="description" content="Contact Another Artisanal." />
  <link rel="canonical" href="https://anotherartisanal.eu/contact.html" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand-mark" href="/">Another Artisanal</a>
    <nav class="nav">
      <a href="/#shop" data-i18n="nav_shop">Shop</a>
      <a href="/#about" data-i18n="nav_about">About</a>
      <a href="/account.html" data-i18n="nav_account">Account</a>
      <a href="/#bag"><span data-i18n="nav_bag">Bag</span> <span class="cart-count" data-bag-count></span></a>
      <span class="header-tools">
        <span class="toggle-group"><button data-lang-btn="en">EN</button><button data-lang-btn="pl">PL</button></span>
        <span class="toggle-group"><button data-currency-btn="eur">€</button><button data-currency-btn="pln">zł</button></span>
      </span>
    </nav>
  </header>

  <main class="wrap static-page">
    <h1 data-i18n="contact_title">Contact</h1>
    <p data-i18n="contact_body">Questions about an order, sizing or anything else — write to us.</p>
    <p style="margin-top:24px;">
      <span class="section-heading" style="text-align:left;display:block;margin-bottom:6px;" data-i18n="contact_email_label">Email</span>
      <a href="mailto:hello@anotherartisanal.eu" style="border-bottom:1px solid var(--line);">hello@anotherartisanal.eu</a>
    </p>
  </main>

  <section class="newsletter">
    <h3 data-i18n="footer_newsletter">Join the list</h3>
    <p data-i18n="footer_newsletter_sub">New arrivals and occasional notes. No noise.</p>
    <form class="newsletter-form" id="newsletter-form">
      <input class="newsletter-input" type="email" data-i18n-placeholder="footer_email_placeholder" placeholder="Email address" required />
      <button class="newsletter-btn" type="submit" data-i18n="footer_subscribe">Subscribe</button>
    </form>
    <p class="newsletter-status" id="newsletter-status"></p>
  </section>
  <footer>
    <div class="footer-left">&copy; Another Artisanal</div>
    <div class="footer-right">
      <a href="/contact.html" data-i18n="footer_contact">Contact</a>
      <a href="/legal.html" data-i18n="footer_legal">Terms &amp; privacy</a>
    </div>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
