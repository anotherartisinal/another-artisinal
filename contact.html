<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Another Artisanal</title>
  <meta name="description" content="Contact Another Artisanal." />
  <link rel="canonical" href="https://anotherartisanal.eu/contact.html" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-mark" href="/">Another Artisanal</a>
      <nav class="nav">
        <a href="/#shop" data-i18n="nav_shop">Shop</a>
        <a href="/#about" data-i18n="nav_about">About</a>
        <a href="/account.html" data-i18n="nav_account">Account</a>
        <a class="bag-link" href="/#bag"><span data-i18n="nav_bag">Bag</span><span data-bag-count></span></a>
      </nav>
      <div class="header-tools">
        <div class="toggle-group"><button data-lang-btn="en">EN</button><button data-lang-btn="pl">PL</button></div>
        <div class="toggle-group"><button data-currency-btn="eur">€</button><button data-currency-btn="pln">zł</button></div>
      </div>
    </div>
  </header>

  <main class="wrap static-page">
    <h1 data-i18n="contact_title">Contact</h1>
    <p data-i18n="contact_body">Questions about an order, sizing or anything else — write to us.</p>
    <p style="margin-top:24px;">
      <span class="section-heading" style="text-align:left;display:block;margin-bottom:6px;" data-i18n="contact_email_label">Email</span>
      <a href="mailto:hello@anotherartisanal.eu" style="border-bottom:1px solid var(--line);">hello@anotherartisanal.eu</a>
    </p>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-news">
        <h3 data-i18n="footer_newsletter">Join the list</h3>
        <p data-i18n="footer_newsletter_sub">New arrivals and occasional notes. No noise.</p>
        <form class="news-form" id="newsletter-form">
          <input type="email" data-i18n-placeholder="footer_email_placeholder" placeholder="Email address" required />
          <button class="btn" type="submit" data-i18n="footer_subscribe">Subscribe</button>
        </form>
        <p class="muted" id="newsletter-status" style="font-size:12px;margin-top:8px;"></p>
      </div>
      <div>
        <div class="footer-links">
          <a href="/contact.html" data-i18n="footer_contact">Contact</a>
          <a href="/legal.html" data-i18n="footer_legal">Terms &amp; privacy</a>
        </div>
        <p class="footer-legal" style="margin-top:24px;">&copy; Another Artisanal. <span data-i18n="footer_rights">All rights reserved.</span></p>
      </div>
    </div>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
